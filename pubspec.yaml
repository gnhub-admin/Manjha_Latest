name: manjha
description: A new Flutter project.
publish_to: 'none'

version: 5.0.2+19

environment:
  sdk: '>=2.19.6 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  get: ^4.6.5
  google_fonts: ^4.0.4
  image_picker: ^1.0.4
  carousel_slider: ^4.2.1
  dartx: ^1.2.0
  dartz: ^0.10.1
  dio: ^5.4.0
  logger: ^2.4.0
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.2.3
  firebase_core: ^2.24.2
  animated_text_kit: ^4.2.2
  font_awesome_flutter: ^10.4.0
  firebase_messaging: ^14.7.9
  flutter_easyloading: ^3.0.5
  geolocator: ^10.1.0
  requests: ^4.7.0
  device_info: ^2.0.3
  android_intent: ^2.0.2
  firebase_analytics: ^10.7.4
  shared_preferences: ^2.2.2
  url_launcher: ^6.1.11
  firebase_auth: ^4.15.3
  sms_autofill: ^2.3.0
  fluttertoast: ^8.2.4

  # IMPORTANT for Flutter 3.7.12
  intl: 0.17.0

  flutter_widget_from_html: ^0.14.10+1
  dynamic_height_grid_view: ^0.0.4
  lazy_load_scrollview: ^1.3.0
  share_plus: ^7.2.1
  shimmer: ^3.0.0
  file_picker: ^5.3.1
  video_player: ^2.7.2
  photo_view: ^0.15.0
  paytm_allinonesdk: ^1.2.1
  flutter_clarity: ^1.0.0+3
  pinput: ^4.0.0
  html: ^0.15.4
  path_provider: ^2.1.1
  loading_animation_widget: ^1.2.1
  mixpanel_flutter: ^2.2.0
  path: ^1.8.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0

flutter_icons:
  android: true
  ios: true
  image_path: 'assets/logo.png'

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/

  fonts:
    - family: nunito
      fonts:
        - asset: fonts/nunito/Nunito-Black.ttf
        - asset: fonts/nunito/Nunito-Bold.ttf
        - asset: fonts/nunito/Nunito-Regular.ttf
        - asset: fonts/nunito/Nunito-Light.ttf
